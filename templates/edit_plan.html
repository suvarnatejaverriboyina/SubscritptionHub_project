
{% extends "base.html" %}

{% block title %}Edit Plan - SMS Hub{% endblock %}

{% block content %}
<section class="manage-plans-section">

    <div class="manage-plans-header">
        <p class="dashboard-label">ADMINISTRATION</p>
        <h1>Edit Subscription Plan</h1>
        <p>Update the details of your subscription plan.</p>
    </div>

    <div class="plan-form-card">
        <h2>Edit Plan #{{ plan.plan_id }}</h2>

        <form action="{{ url_for('edit_plan', plan_id=plan.plan_id) }}"
              method="POST"
              class="plan-form">

            <div class="plan-form-group">
                <label for="plan_name">Plan Name</label>
                <input type="text"
                       id="plan_name"
                       name="plan_name"
                       value="{{ plan.plan_name }}"
                       maxlength="100"
                       required>
            </div>

            <div class="plan-form-group">
                <label for="price">Price (₹)</label>
                <input type="number"
                       id="price"
                       name="price"
                       value="{{ plan.price }}"
                       min="0.01"
                       step="0.01"
                       required>
            </div>

            <div class="plan-form-group">
                <label for="duration">Duration (days)</label>
                <input type="number"
                       id="duration"
                       name="duration"
                       value="{{ plan.duration }}"
                       min="1"
                       step="1"
                       required>
            </div>

            <button type="submit"
                    class="dashboard-btn plan-submit-btn">
                Save Changes
            </button>

            <a href="{{ url_for('manage_plans') }}"
               class="dashboard-btn">
                Cancel
            </a>

        </form>
    </div>

</section>
{% endblock %}
